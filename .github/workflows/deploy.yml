name: Deploy Gold Pour

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: goldpour-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to production server
    runs-on: ubuntu-latest

    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      SERVER_PORT: ${{ secrets.SERVER_PORT || 22 }}
      SERVER_PATH: /var/www/goldpour

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/goldpour_deploy_key
          chmod 600 ~/.ssh/goldpour_deploy_key
          ssh-keyscan -p "$SERVER_PORT" "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Ensure rsync exists on server
        shell: bash
        run: |
          ssh -i ~/.ssh/goldpour_deploy_key -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" \
            "command -v rsync >/dev/null 2>&1 || (apt-get update && apt-get install -y rsync)"

      - name: Upload project files
        shell: bash
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/goldpour_deploy_key -p $SERVER_PORT" \
            --exclude ".git/" \
            --exclude ".github/" \
            --exclude ".env" \
            --exclude "node_modules/" \
            --exclude "dist/" \
            --exclude "server/storage/" \
            --exclude "assets/" \
            --exclude "images/" \
            --exclude "index.html" \
            --exclude "_redirects" \
            --exclude "favicon.png" \
            --exclude "robots.txt" \
            --exclude "sitemap.xml" \
            ./ "$SERVER_USER@$SERVER_HOST:$SERVER_PATH/"

      - name: Install, build and restart
        shell: bash
        run: |
          ssh -i ~/.ssh/goldpour_deploy_key -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" <<'EOF'
            set -e
            cd /var/www/goldpour
            npm ci --omit=dev
            npm run build
            rm -rf assets images index.html _redirects favicon.png robots.txt sitemap.xml
            cp -r dist/* .
            find /var/www/goldpour -type d -exec chmod 755 {} \;
            find /var/www/goldpour -type f -exec chmod 644 {} \;
            pm2 restart goldpour-api
            systemctl reload nginx
          EOF
